name: nightly-post
on:
  schedule:
    - cron: "20 2 * * *"   # 02:20 UTC nightly = 04:20 Zurich, runs on GitHub infra
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: nightly
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish next post from bank
        id: pub
        run: python3 scripts/publish.py
      - name: Commit and push
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add -A
          git commit -m "nightly blog post" || echo "nothing to commit"
          git push
      - name: Ping IndexNow
        continue-on-error: true  # self-heals once DNS points at GitHub Pages
        if: steps.pub.outputs.url != ''
        env:
          POST_URL: ${{ steps.pub.outputs.url }}
        run: |
          python3 - <<'PY'
          import json, urllib.request
          import glob, os
          key = open([f for f in glob.glob("*.txt") if len(f[:-4]) == 32][0]).read().strip()
          host = "blog.codefixcoffee.com"
          urls = [os.environ["POST_URL"], f"https://{host}/"]
          body = json.dumps({"host": host, "key": key, "keyLocation": f"https://{host}/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/IndexNow?url=&json=true", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
          try: print("indexnow", urllib.request.urlopen(req, timeout=20).status)
          except Exception as e: print("indexnow skipped:", e)
          PY
      - name: Remind to refill bank
        if: steps.pub.outputs.empty == 'true'
        run: gh issue create --title "Blog bank is empty" --body "The nightly publisher found no queued posts. Add new .md files to bank/." || true
        env:
          GH_TOKEN: ${{ github.token }}
